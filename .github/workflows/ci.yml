name: CI

# EVERY JOB RUNS CHORE TASKS, so a green local `chore test` is the same
# evidence as a green run here (see the test contract at the top of
# chores.yml):
#
#   unit       `chore test:unit` on a runner with NO fixtures: the tests
#              that need no tool and no fixture, in the debug profile
#              that traps an arithmetic overflow. That the job passes
#              with test-disks/ empty is what proves the split.
#   fixtures   `chore fixtures`: the kernel-made images, built in the
#              fs-linux-test-harness VM under KVM on x86_64, and handed
#              to the test jobs as an artifact (they are disk images, the
#              same for every architecture).
#   test       on BOTH native architectures: `chore tools` installs the
#              oracle tools, `chore lint`, then `chore test` — unit,
#              the whole suite in release with the fixtures and e2fsprogs
#              on the host, and the script tests. aarch64 matters on its
#              own: c_char is unsigned there, and it is what DiskJockey
#              ships on. GitHub's arm64 runners have no KVM, which is why
#              the fixtures come from the x86_64 job rather than a VM here.
#   ci-ok      the one required check: green only when every job above
#              ran and succeeded (failed, cancelled OR skipped fails it).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"

jobs:
  unit:
    name: unit (no tools, no fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        # Pinned (CHORE_VERSION) and checked against the release's
        # checksums: the siblings, the tools and the tests all come
        # through it.
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        # rust-fs-core (the path dependency) and fs-linux-test-harness, at
        # the refs pinned in chores.yml.
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-unit-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: No fixtures are present
        run: |
          set -euo pipefail
          if ls test-disks/*.img >/dev/null 2>&1; then
            echo "::error::test-disks/ has images; this job must prove the unit tier needs none"
            exit 1
          fi
      - name: chore test:unit
        run: chore test:unit

  fixtures:
    name: fixtures (harness VM, x86_64 KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore fixtures
        run: chore fixtures
      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: test-disks/*.img
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.arch }})
    needs: fixtures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: chore tools
        run: chore tools
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: test-disks
      - name: chore lint
        run: chore lint
      - name: chore test
        run: chore test

  ci-ok:
    name: ci-ok
    if: always()
    needs: [unit, fixtures, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
